name: Build chopin KernelSU+SUSFS

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache
          df -h

      - name: Checkout kernel source (fork with adapted SUSFS files)
        uses: actions/checkout@v4
        with:
          repository: Bison686/android_kernel_chopin_android_T
          ref: T
          path: kernel
          fetch-depth: 1

      - name: Clone clang toolchain
        run: |
          git clone --depth 1 -b lineage-20.0 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git clang
          ls clang/

      - name: Install aarch64 binutils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Integrate KernelSU v1.0.5 (matches susfs4ksu kernel-4.14 branch)
        run: |
          cd kernel
          # susfs4ksu kernel-4.14 分支官方同步 KernelSU tag v1.0.5（README: "Bump version to v1.5.8; Still sync with KernelSU tag v1.0.5"）
          git clone --depth 1 -b v1.0.5 https://github.com/tiann/KernelSU.git KernelSU
          ln -sf "$(pwd)/KernelSU/kernel" drivers/kernelsu
          # 4.14 compat: MODULE_IMPORT_NS is 5.4+ only; remove from all KernelSU sources
          grep -rl 'MODULE_IMPORT_NS' KernelSU/ 2>/dev/null | xargs -r sed -i '/MODULE_IMPORT_NS/d'
          grep -q "kernelsu" drivers/Makefile || echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig
          echo "--- KernelSU v1.0.5 integrated ---"

      - name: Apply SUSFS enable patch (files already adapted in repo)
        run: |
          cd kernel
          KROOT="$PWD"
          git clone --depth 1 -b kernel-4.14 https://github.com/ShirkNeko/susfs4ksu.git susfs
          cp susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          cd KernelSU
          patch -p1 < 10_enable_susfs_for_ksu.patch
          cd "$KROOT"
          echo "--- verify (fail fast) ---"
          test ! -f KernelSU/kernel/core_hook.c.rej || { echo "ERROR: core_hook.c.rej exists - KernelSU version mismatch"; exit 1; }
          ls KernelSU/kernel/*.rej 2>/dev/null || echo "no rejects (good)"
          test -f fs/susfs.c || { echo "ERROR: fs/susfs.c missing - adapted file not in repo"; exit 1; }
          test -f fs/sus_su.c || { echo "ERROR: fs/sus_su.c missing"; exit 1; }
          test -f include/linux/susfs.h || { echo "ERROR: include/linux/susfs.h missing"; exit 1; }
          test -f include/linux/susfs_def.h || { echo "ERROR: include/linux/susfs_def.h missing"; exit 1; }
          grep -q "KSU_SUSFS" KernelSU/kernel/Kconfig || { echo "ERROR: KSU_SUSFS not in Kconfig - patch failed"; exit 1; }
          # 确认已适配文件特征（防止 checkout 旧文件）
          grep -q "susfs_is_inode_sus_path" fs/namei.c || { echo "ERROR: fs/namei.c not adapted"; exit 1; }
          grep -q "susfs_mnt_id_ida" fs/namespace.c || { echo "ERROR: fs/namespace.c not adapted"; exit 1; }
          grep -q "obj-\$(CONFIG_KSU_SUSFS) += susfs.o" fs/Makefile || { echo "ERROR: fs/Makefile not adapted"; exit 1; }
          grep -q "HIDE_KSU_SUSFS_SYMBOLS" kernel/kallsyms.c || { echo "ERROR: kernel/kallsyms.c not adapted"; exit 1; }
          echo "SUSFS adapted files OK"

      - name: Enable KSU and SUSFS configs
        run: |
          cd kernel
          # 全关栈保护：4.14 内核的编译器能力检测与 clang 不兼容（arm64 只有 STRONG 版，没有普通版可回退）
          sed -i '/CONFIG_CC_STACKPROTECTOR/d' arch/arm64/configs/chopin_user_defconfig
          echo "# CONFIG_CC_STACKPROTECTOR is not set" >> arch/arm64/configs/chopin_user_defconfig
          echo "# CONFIG_CC_STACKPROTECTOR_STRONG is not set" >> arch/arm64/configs/chopin_user_defconfig
          for cfg in \
            CONFIG_KPROBES=y \
            CONFIG_KALLSYMS=y \
            CONFIG_KALLSYMS_ALL=y \
            CONFIG_KSU=y \
            CONFIG_KSU_SUSFS=y \
            CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y \
            CONFIG_KSU_SUSFS_SUS_PATH=y \
            CONFIG_KSU_SUSFS_SUS_MOUNT=y \
            CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y \
            CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y \
            CONFIG_KSU_SUSFS_SUS_KSTAT=y \
            CONFIG_KSU_SUSFS_TRY_UMOUNT=y \
            CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y \
            CONFIG_KSU_SUSFS_SPOOF_UNAME=y \
            CONFIG_KSU_SUSFS_ENABLE_LOG=y \
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y \
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y \
            CONFIG_KSU_SUSFS_OPEN_REDIRECT=y \
            CONFIG_KSU_SUSFS_SUS_SU=y
          do
            echo "$cfg" >> arch/arm64/configs/chopin_user_defconfig
          done
          echo "--- defconfig tail ---"
          tail -5 arch/arm64/configs/chopin_user_defconfig

      - name: Fix legacy C prototypes
        run: |
          cd kernel
          # 先还原误伤的调用处，再只修声明行（213 行）
          sed -i 's/hw_item_dump(void)/hw_item_dump()/g' arch/arm64/kernel/hwconf_manager.c
          sed -i '213s/hw_item_dump()/hw_item_dump(void)/' arch/arm64/kernel/hwconf_manager.c
          echo "--- fixed line 213 ---"
          sed -n '213p;280p' arch/arm64/kernel/hwconf_manager.c

      - name: Remove -Werror flags (precise, keep $(call) syntax)
        run: |
          cd kernel
          # 4.14 老内核 + 新 clang：只精准删除 -Werror 标志本身，保留 $(call cc-option, ...) 括号结构
          sed -i \
            -e 's/-Werror=strict-prototypes//g' \
            -e 's/-Werror=implicit-int//g' \
            -e 's/-Werror=date-time//g' \
            -e 's/-Werror=incompatible-pointer-types//g' \
            -e 's/-Werror=designated-init//g' \
            -e 's/-Werror-implicit-function-declaration//g' \
            -e 's/-Werror=unknown-warning-option//g' \
            Makefile
          echo "--- verify line 987-999 ---"
          sed -n '987p;990p;993p;996p;999p' Makefile
          echo "=== remaining -Werror in all Makefiles ==="
          grep -rn --include="Makefile" "\-Werror" . | head -20 || echo "none"
          # 处理子目录 Makefile 里的独立 -Werror（如 subdir-ccflags-y += -Werror），只删带空格/行尾边界的独立标志，绝不碰 -Werror=xxx
          for f in $(grep -rl --include="Makefile" -- "-Werror" .); do
            sed -i 's/ -Werror / /g; s/ -Werror$/ /g' "$f"
          done
          echo "=== after: remaining -Werror ==="
          grep -rn --include="Makefile" "\-Werror" . | head -10 || echo "none"

      - name: 4.14 compat - strip KernelSU selinux sepolicy module (last, right before build)
        run: |
          cd kernel
          # KernelSU v1.0.5 selinux/sepolicy.c targets 5.9+ policydb structures
          # (filename_trans_key/type_val_to_struct/policy member) - not present on chopin 4.14.
          # Boot is permissive, so in-kernel sepolicy patching is not required.
          # sepolicy.o/rules.o are listed in BOTH the top-level kernelsu-objs AND selinux/Makefile.
          sed -i '/selinux\/sepolicy.o/d; /selinux\/rules.o/d' KernelSU/kernel/Makefile
          sed -i '/obj-y += sepolicy.o/d; /obj-y += rules.o/d' KernelSU/kernel/selinux/Makefile
          sed -i '/ksu_apply_kernelsu_rules();/d' KernelSU/kernel/ksud.c
          sed -i '/extern int ksu_handle_sepolicy/d; s/if (!ksu_handle_sepolicy(arg3, arg4)) {/if (0) {/' KernelSU/kernel/core_hook.c
          grep -rn "ksu_handle_sepolicy\|ksu_apply_kernelsu_rules" KernelSU/kernel --include=*.c | grep -v "//" || true
          echo "=== top-level kernelsu-objs ==="
          grep -n "selinux" KernelSU/kernel/Makefile
          echo "=== selinux Makefile after strip ==="
          cat KernelSU/kernel/selinux/Makefile
          grep -q 'sepolicy' KernelSU/kernel/Makefile KernelSU/kernel/selinux/Makefile && { echo "ERROR: sepolicy still referenced"; exit 1; } || echo "OK: sepolicy.o/rules.o removed from both Makefiles"

      - name: Build kernel
        run: |
          set -o pipefail
          cd kernel
          echo "=== PRE-BUILD ASSERT: sepolicy references ==="
          grep -rn "sepolicy" KernelSU/kernel/Makefile KernelSU/kernel/selinux/Makefile || echo "OK: no sepolicy references in Makefiles"
          grep -q 'sepolicy' KernelSU/kernel/Makefile KernelSU/kernel/selinux/Makefile && { echo "FATAL: sepolicy still referenced"; exit 1; } || echo "OK: sepolicy stripped from both Makefiles"
          export PATH="$GITHUB_WORKSPACE/clang/clang-r416183b/bin:$PATH"
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- chopin_user_defconfig 2>&1 | tail -20
          echo "=== config check ==="
          grep -E "CONFIG_KSU|CONFIG_KPROBES|CONFIG_KALLSYMS|CONFIG_SUSFS" out/.config || true
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-Wno-error -Wno-error=strict-prototypes" -j4 2>&1 | tee build.log | tail -100
          echo "=== boot output ==="
          ls -la out/arch/arm64/boot/ || true
          test -f out/arch/arm64/boot/Image.gz-dtb && echo "Image.gz-dtb EXISTS" || { echo "KERNEL MISSING - BUILD FAILED"; exit 1; }

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chopin-build-log
          path: kernel/build.log
          if-no-files-found: ignore

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: chopin-kernel-susfs
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/dts/mediatek/*.dtb
            kernel/build.log
          if-no-files-found: warn
