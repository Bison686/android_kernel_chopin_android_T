name: Build chopin v22 KernelSU-Next + SUSFS v2.2.0

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache
          df -h

      - name: Checkout kernel source (v22, KernelSU-Next plus SUSFS v2.2.0 integrated)
        uses: actions/checkout@v4
        with:
          repository: Bison686/android_kernel_chopin_android_T
          ref: v22
          path: kernel
          fetch-depth: 1

      - name: Clone clang toolchain
        run: |
          git clone --depth 1 -b lineage-20.0 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git clang
          ls clang/

      - name: Install aarch64 binutils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Verify integrated sources
        run: |
          cd kernel
          test -f drivers/kernelsu/Makefile || { echo "ERROR: kernelsu missing"; exit 1; }
          test -f fs/susfs.c || { echo "ERROR: fs/susfs.c missing"; exit 1; }
          test -f include/linux/susfs_def.h || { echo "ERROR: susfs_def.h missing"; exit 1; }
          grep -q "SUSFS_MAGIC" include/linux/susfs_def.h || { echo "ERROR: SUSFS_MAGIC missing - wrong susfs version"; exit 1; }
          grep -q "kernel_umount_feature_set" drivers/kernelsu/feature/kernel_umount.c || { echo "ERROR: kernel_umount_feature_set missing"; exit 1; }
          grep -q "obj-\$(CONFIG_KSU_SUSFS) += susfs.o" fs/Makefile || { echo "ERROR: fs/Makefile missing susfs.o"; exit 1; }
          grep -q "CONFIG_KSU=y" arch/arm64/configs/chopin_user_defconfig || { echo "ERROR: defconfig missing KSU"; exit 1; }
          echo "=== all sources verified ==="

      - name: Fix legacy C prototypes
        run: |
          cd kernel
          sed -i 's/hw_item_dump(void)/hw_item_dump()/g' arch/arm64/kernel/hwconf_manager.c
          sed -i '213s/hw_item_dump()/hw_item_dump(void)/' arch/arm64/kernel/hwconf_manager.c
          echo "--- fixed line 213 ---"
          sed -n '213p' arch/arm64/kernel/hwconf_manager.c

      - name: Remove Werror flags
        run: |
          cd kernel
          sed -i \
            -e 's/-Werror=strict-prototypes//g' \
            -e 's/-Werror=implicit-int//g' \
            -e 's/-Werror=date-time//g' \
            -e 's/-Werror=incompatible-pointer-types//g' \
            -e 's/-Werror=designated-init//g' \
            -e 's/-Werror-implicit-function-declaration//g' \
            -e 's/-Werror=unknown-warning-option//g' \
            Makefile
          for f in $(grep -rl --include="Makefile" -- "-Werror" .); do
            sed -i 's/ -Werror / /g; s/ -Werror$/ /g' "$f"
          done
          echo "=== remaining -Werror ==="
          grep -rn --include="Makefile" "\-Werror" . | head -10 || echo "none"

      - name: Build kernel
        run: |
          set -o pipefail
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/clang-r416183b/bin:$PATH"
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- chopin_user_defconfig 2>&1 | tail -20
          echo "=== config check ==="
          grep -E "CONFIG_KSU|CONFIG_KALLSYMS|CONFIG_SUSFS|CONFIG_KPROBES|CONFIG_CC_STACKPROTECTOR" out/.config || true
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-Wno-error -Wno-error=strict-prototypes" -j4 2>&1 | tee build.log | tail -100
          echo "=== boot output ==="
          ls -la out/arch/arm64/boot/ || true
          test -f out/arch/arm64/boot/Image.gz-dtb && echo "Image.gz-dtb EXISTS" || { echo "KERNEL MISSING - BUILD FAILED"; exit 1; }

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chopin-v22-build-log
          path: kernel/build.log
          if-no-files-found: ignore

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: chopin-v22-kernel
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/dts/mediatek/*.dtb
            kernel/build.log
            kernel/out/.config
          if-no-files-found: warn
