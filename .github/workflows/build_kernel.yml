name: Build chopin KernelSU+SUSFS

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache
          df -h

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ChopinKernels/android_kernel_chopin_android_T
          ref: T
          path: kernel
          fetch-depth: 1

      - name: Clone clang toolchain
        run: |
          git clone --depth 1 -b lineage-20.0 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git clang
          ls clang/

      - name: Install aarch64 binutils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Integrate KernelSU v1.0.2
        run: |
          cd kernel
          git clone --depth 1 -b v1.0.2 https://github.com/tiann/KernelSU.git KernelSU
          ln -sf "$(pwd)/KernelSU/kernel" drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig
          echo "--- KernelSU integrated ---"

      - name: Apply SUSFS patches
        run: |
          cd kernel
          git clone --depth 1 -b kernel-4.14 https://github.com/ShirkNeko/susfs4ksu.git susfs
          cp susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          cp susfs/kernel_patches/50_add_susfs_in_kernel-4.14.patch .
          cp susfs/kernel_patches/fs/* fs/
          cp susfs/kernel_patches/include/linux/* include/linux/
          cd KernelSU && patch -p1 < 10_enable_susfs_for_ksu.patch && cd ..
          patch -p1 < 50_add_susfs_in_kernel-4.14.patch || echo "WARN: 50 patch failed, continue anyway"
          echo "--- verify files ---"
          ls -la include/linux/susfs.h fs/susfs.c 2>/dev/null || true
          grep -c "KSU_SUSFS" KernelSU/kernel/Kconfig 2>/dev/null || true

      - name: Enable KSU and SUSFS configs
        run: |
          cd kernel
          cat >> arch/arm64/configs/chopin_user_defconfig <<'EOF'

# --- KernelSU + SUSFS ---
CONFIG_KPROBES=y
CONFIG_KALLSYMS=y
CONFIG_KALLSYMS_ALL=y
CONFIG_KSU=y
CONFIG_KSU_SUSFS=y
CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
CONFIG_KSU_SUSFS_SUS_PATH=y
CONFIG_KSU_SUSFS_SUS_MOUNT=y
CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
CONFIG_KSU_SUSFS_SUS_KSTAT=y
CONFIG_KSU_SUSFS_TRY_UMOUNT=y
CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
CONFIG_KSU_SUSFS_SPOOF_UNAME=y
CONFIG_KSU_SUSFS_ENABLE_LOG=y
CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
CONFIG_KSU_SUSFS_SUS_SU=y
EOF

      - name: Build kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/clang-r416183b/bin:$PATH"
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- chopin_user_defconfig 2>&1 | tail -20
          echo "=== config check ==="
          grep -E "CONFIG_KSU|CONFIG_KPROBES|CONFIG_KALLSYMS|CONFIG_SUSFS" out/.config || true
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) 2>&1 | tee build.log | tail -100
          echo "=== boot output ==="
          ls -la out/arch/arm64/boot/ || true
          find out -name "Image*" -o -name "*.dtb" 2>/dev/null | head -20 || true

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: chopin-kernel-susfs
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/dts/mediatek/*.dtb
            kernel/build.log
          if-no-files-found: warn
